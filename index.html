<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Favicon。Google 搜尋結果只認「正方形、邊長是 48 的倍數」的圖，
       小於這個尺寸就會退回顯示它自己的地球圖示。網址要固定不要改，
       換圖直接覆蓋同一個檔名，Google 重新檢索時才會沿用同一份紀錄。 -->
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO tags are generated at build time and kept in sync by React Helmet. -->

  <!-- DNS Prefetch & Preconnect for performance -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Optimized Font Loading with display=swap -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" media="print"
    onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Defer non-critical CSS -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" media="print"
    onload="this.media='all'" />
  <noscript>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  </noscript>

  <!-- Critical CSS inline for faster FCP -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif
    }

    #root {
      min-height: 100vh
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f9fafb
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5CP17W4XQV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-5CP17W4XQV');
  </script>

  <script>
    // 靜態快照是給爬蟲看的底稿，正常情況下 React 一載入就會蓋掉它。
    // 若 10 秒後還在（通常是部署後舊分頁的 JS 檔名已失效、或檔案抓不到），
    // 就明講「沒載完」，而不是讓使用者停在只剩標題的底稿上、以為內容被換掉了。
    // 注意：這段必須放在 <head>，prerender 會把 #root 到 </body> 之間整段換掉。
    setTimeout(function () {
      var stuck = document.querySelector('#root .seo-static-snapshot, #root .loading-spinner');
      if (!stuck || document.getElementById('bjj-load-warning')) return;
      var bar = document.createElement('div');
      bar.id = 'bjj-load-warning';
      bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:14px 18px;' +
        'background:#1F3A5F;color:#fff;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;' +
        'display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap';
      var text = document.createElement('span');
      text.textContent = '頁面沒有載入完成，請重新整理';
      var btn = document.createElement('button');
      btn.textContent = '重新整理';
      btn.style.cssText = 'background:#fff;color:#1F3A5F;border:0;border-radius:6px;' +
        'padding:8px 18px;font-weight:600;font-size:15px;cursor:pointer';
      btn.onclick = function () { location.reload(); };
      bar.appendChild(text);
      bar.appendChild(btn);
      document.body.appendChild(bar);
    }, 10000);
  </script>
</head>

<body>
  <div id="root">
    <!-- Loading placeholder for better perceived performance -->
    <div class="loading-spinner" aria-label="載入中...">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18" stroke="#2C5183" stroke-width="3" fill="none" stroke-dasharray="90 150"
          stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s"
            repeatCount="indefinite" />
        </circle>
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
